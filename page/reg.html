<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Singup</title>
    <link rel="stylesheet" href="../css/signup.css" />
    <link rel="stylesheet" href="../css/reset.css" />
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  </head>
  <body>
    <div class="content">
      <!-- <div class="popup hide">
        <div class="notification">
          <img src="../assets/icon/icon_success.svg" alt="successfully" />
          <p>Singup successfully</p>
        </div>
      </div> -->

      <div class="img">
        <img src="../assets/images/logo_reg.png" alt="logo" />
      </div>
      <h2>Please sign up</h2>
      <form action="">
        <input id="email" type="email" placeholder="Email address" />
        <p class="check"></p>
        <input id="username" type="text" placeholder="Username" />
        <p class="check"></p>
        <input id="password" type="password" placeholder="Password" />
        <p class="check"></p>
        <input
          type="password"
          id="confirm-password"
          placeholder="Confirm Password"
        />
        <p class="check"></p>
        <p>Alrealy have an account, <a href="../index.html">click here!</a></p>
        <button class="btn">Sign up</button>
      </form>
      <p class="footer">&copy; 2025 - Rikkei Education</p>
    </div>
    <script src="../js/sign_up.js"></script>
  </body>
</html>
